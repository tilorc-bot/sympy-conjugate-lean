name: Proofs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz' | sha256sum -c -
          mkdir /tmp/elan-install
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-install
          /tmp/elan-install/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked mathlib cache and check proofs
        run: |
          lake exe cache get Mathlib.Analysis.SpecialFunctions.Pow.Complex
          lake build
          python scripts/check_axioms.py
          git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.toml
      - name: Check frozen source and integration boundaries
        run: |
          git init /tmp/sympy-target
          git -C /tmp/sympy-target fetch --depth 1 https://github.com/sympy/sympy.git 3bc91a30609223ca4e7da1a6feaf62bc179a6f7e
          git -C /tmp/sympy-target checkout --detach FETCH_HEAD
          python scripts/check_spec.py /tmp/sympy-target
          python -m pip install -r scripts/requirements.txt
          python scripts/check_boundaries.py /tmp/sympy-target
